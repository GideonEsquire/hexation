<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hex Slide-Capture (p5.js)</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #0f1115;
      color: #e5e9f0;
      font-family: system-ui, sans-serif;
    }

    #ui {
      position: fixed;
      inset: 12px auto auto 12px;
      background: #181a20;
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #2a2f3a;
      color: #e5e9f0;
      font-weight: 600;
    }

    a {
      color: #88c0d0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <div id="ui">
    <div><strong>Hex Slide-Capture (v2)</strong></div>
    <div style="margin-top:6px">Turn: <span id="turn" class="badge">White</span></div>
    <div id="resetWrap" style="margin-top:8px; display:none;">
      <button id="resetBtn" style="background:#2e3440;color:#eceff4;border:none;padding:6px 12px;
           border-radius:6px;cursor:pointer;font-weight:600;">
        Reset Game
      </button>
    </div>
    <div style="margin-top:6px;font-size:13px;opacity:.85">
      Click a piece ➜ click a highlighted hex. Slide any distance; land on enemy to capture.
    </div>
  </div>

  <!-- p5.js v2 (pin to current 2.0.5) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.0.5/lib/p5.min.js"></script>
  <script>
    /* === Geometry & coordinates (axial) === */
    const RADIUS = 5;                  // board radius (hexagon with 2*R+1 rows at widest)
    const HEX_SIZE = 36;               // pixel radius of hex
    const OUTLINE = 1.5;
    const DRONES_PER_SIDE = 6; // tweak to your liking
    const MAX_STACK = 5;

    function isCenter(q, r) {
      return q === 0 && r === 0;
    }
    function isPerimeter(q, r) {
      // A hex is on the perimeter if any of |q|, |r|, |q+r| equals RADIUS
      return Math.abs(q) === RADIUS || Math.abs(r) === RADIUS || Math.abs(q + r) === RADIUS;
    }

    const dirs = [                     // axial neighbor directions (pointy-top)
      {q: +1, r: 0}, {q: +1, r: -1}, {q: 0, r: -1},
      {q: -1, r: 0}, {q: -1, r: +1}, {q: 0, r: +1}
    ];

    function axialToPixel(q, r) {
      const x = HEX_SIZE * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
      const y = HEX_SIZE * (3 / 2 * r);
      return {x, y};
    }

    function pixelToAxial(x, y) {
      // inverse of axialToPixel using "pointy" orientation
      const qf = (Math.sqrt(3) / 3 * x - 1 / 3 * y) / HEX_SIZE;
      const rf = (2 / 3 * y) / HEX_SIZE;
      return cubeRound(axialToCube(qf, rf));
    }

    function axialToCube(q, r) {return {x: q, y: -q - r, z: r};}
    function cubeToAxial(x, y, z) {return {q: x, r: z};}
    function cubeRound(c) {
      let rx = Math.round(c.x), ry = Math.round(c.y), rz = Math.round(c.z);
      const x_diff = Math.abs(rx - c.x);
      const y_diff = Math.abs(ry - c.y);
      const z_diff = Math.abs(rz - c.z);
      if (x_diff > y_diff && x_diff > z_diff) rx = -ry - rz;
      else if (y_diff > z_diff) ry = -rx - rz;
      else rz = -rx - ry;
      return cubeToAxial(rx, ry, rz);
    }

    // 3-color palette for base tiles
    const TRI_COLORS = ['#1b1f27', '#202633', '#242b39']; // tweak freely

    function triColorIndex(q, r) {
      return ((q - r) % 3 + 3) % 3; // 0,1,2 repeating
    }

    function inBounds(q, r) {
      return Math.abs(q) <= RADIUS && Math.abs(r) <= RADIUS && Math.abs(q + r) <= RADIUS;
    }

    /* === Game state === */
    const State = {
      pieces: new Map(),                 // "q,r" -> { side:'W'|'B', type:'Q'|'D' }
      selected: null,
      legalMoves: [],                    // for play phase
      turn: 'W',
      winner: null,

      // placement phase control
      phase: 'place_queen',              // 'place_queen' | 'place_drones' | 'play'
      placements: {
        W: {queenPlaced: false, dronesPlaced: 0},
        B: {queenPlaced: false, dronesPlaced: 0},
      }
    };

    function coordKey(q, r) {return `${q},${r}`;}
    function getPiece(q, r) {return State.pieces.get(coordKey(q, r)) || null;}
    function setPiece(q, r, p) {if (p) State.pieces.set(coordKey(q, r), p); else State.pieces.delete(coordKey(q, r));}

    /* === Initial setup === */
    function setupPosition() {
      State.pieces.clear();

      State.turn = 'W';
      State.selected = null;
      State.legalMoves = [];
      State.winner = null;

      State.phase = 'place_queen';
      State.placements = {
        W: {queenPlaced: false, dronesPlaced: 0},
        B: {queenPlaced: false, dronesPlaced: 0},
      };

      updateTurnUI();
    }

    function legalMovesFrom(q, r) {
      if (State.phase !== 'play') return [];  // no movement during placement

      const piece = getPiece(q, r);
      if (!piece || piece.side !== State.turn) return [];
      const moves = [];

      if (piece.type === 'Q') {
        // Queen: one step any direction
        for (const d of dirs) {
          const q2 = q + d.q, r2 = r + d.r;
          if (!inBounds(q2, r2)) continue;
          const occ = getPiece(q2, r2);
          if (!occ || occ.side !== piece.side) moves.push({to: {q: q2, r: r2}});
        }
      } else if (piece.type === 'D') {
        // Drone: can move 1..size steps, straight, no passing through pieces
        const maxSteps = Math.max(1, piece.size || 1);
        for (const d of dirs) {
          for (let step = 1; step <= maxSteps; step++) {
            const q2 = q + d.q * step, r2 = r + d.r * step;
            if (!inBounds(q2, r2)) break;
            const occ = getPiece(q2, r2);
            if (!occ) {
              moves.push({to: {q: q2, r: r2}});
            } else {
              if (occ.side !== piece.side) moves.push({to: {q: q2, r: r2}});
              break; // blocked
            }
          }
        }
      }

      return moves;
    }

    function legalPlacementHexes() {
      if (State.winner || State.phase === 'play') return [];

      const spots = [];
      for (let r = -RADIUS; r <= RADIUS; r++) {
        for (let q = -RADIUS; q <= RADIUS; q++) {
          if (!inBounds(q, r) || !isPerimeter(q, r)) continue;
          const occ = getPiece(q, r);

          if (State.phase === 'place_queen') {
            if (!occ) spots.push({q, r, kind: 'empty'});
          } else if (State.phase === 'place_drones') {
            if (!occ) spots.push({q, r, kind: 'empty'});
            else if (occ.side === State.turn && occ.type === 'D')
              spots.push({q, r, kind: 'stack'});
          }
          // in legalPlacementHexes()
          else if (State.phase === 'place_drones') {
            if (!occ) spots.push({q, r, kind: 'empty'});
            else if (occ.side === State.turn && occ.type === 'D' && (occ.size || 1) < MAX_STACK)
              spots.push({q, r, kind: 'stack'});
          }

        }
      }
      return spots;
    }

    function sideNeedsPlacement(side) {
      const P = State.placements[side];
      if (State.phase === 'place_queen') return !P.queenPlaced;
      if (State.phase === 'place_drones') return P.dronesPlaced < DRONES_PER_SIDE;
      return false;
    }

    function advancePlacementTurn() {
      // Move to next phase if both queens placed
      if (State.phase === 'place_queen') {
        if (State.placements.W.queenPlaced && State.placements.B.queenPlaced) {
          State.phase = 'place_drones';
        }
      }

      // If both finished drones, enter play
      if (State.phase === 'place_drones') {
        const Wdone = State.placements.W.dronesPlaced >= DRONES_PER_SIDE;
        const Bdone = State.placements.B.dronesPlaced >= DRONES_PER_SIDE;
        if (Wdone && Bdone) {
          State.phase = 'play';
          updateTurnUI();
          return;
        }
      }

      // Alternate turns, but skip a side that’s finished its placements
      const other = (State.turn === 'W') ? 'B' : 'W';
      if (sideNeedsPlacement(other)) {
        State.turn = other;
      } else if (sideNeedsPlacement(State.turn)) {
        // stay
      } else {
        // if current is done but other still needs, hand it to them
        if (sideNeedsPlacement('W')) State.turn = 'W';
        else if (sideNeedsPlacement('B')) State.turn = 'B';
      }

      updateTurnUI();
    }

    /* === Apply moves === */
    function applyMove(from, move) {
      const src = getPiece(from.q, from.r);
      if (!src) return;

      const moverSide = src.side;
      const captured = getPiece(move.to.q, move.to.r); // may be null

      // move (capture by replacement if occupied)
      setPiece(move.to.q, move.to.r, src);
      setPiece(from.q, from.r, null);

      // queen-capture sudden death (existing rule)
      if (captured && captured.type === 'Q') {
        State.winner = moverSide;
        updateTurnUI();
        return;
      }

      // --- Center-cell effects ---
      if (isCenter(move.to.q, move.to.r)) {
        const landed = getPiece(move.to.q, move.to.r);
        if (landed.type === 'Q') {
          // Queen reaches center: instant win
          State.winner = moverSide;
          updateTurnUI();
          return;
        } else if (landed.type === 'D') {
          // Drone reaches center: upgrade to max stack
          landed.size = MAX_STACK;
          setPiece(move.to.q, move.to.r, landed);
        }
      }

      // (optional) fallback win by elimination
      const hasW = [...State.pieces.values()].some(p => p.side === 'W');
      const hasB = [...State.pieces.values()].some(p => p.side === 'B');
      if (!hasW) {State.winner = 'B'; updateTurnUI(); return;}
      if (!hasB) {State.winner = 'W'; updateTurnUI(); return;}

      switchTurn();
    }

    /* === Turn handling === */
    function switchTurn() {
      State.turn = (State.turn === 'W') ? 'B' : 'W';
      updateTurnUI();
    }

    function updateTurnUI() {
      const el = document.getElementById('turn');

      if (State.winner) {
        el.textContent = (State.winner === 'W' ? 'White wins' : 'Black wins');
      } else if (State.phase === 'place_queen') {
        el.textContent = (State.turn === 'W' ? 'White' : 'Black') + ' — place QUEEN';
      } else if (State.phase === 'place_drones') {
        const P = State.placements[State.turn];
        el.textContent = (State.turn === 'W' ? 'White' : 'Black') + ` — place DRONE (${P.dronesPlaced + 1}/${DRONES_PER_SIDE})`;
      } else {
        el.textContent = (State.turn === 'W' ? 'White' : 'Black');
      }

      // if you added the reset button earlier:
      const wrap = document.getElementById('resetWrap');
      if (wrap) wrap.style.display = State.winner ? 'block' : 'none';
    }

    /* === p5 sketch === */
    let canvasW, canvasH, centerX, centerY;

    function setup() {
      canvasW = Math.max(720, Math.min(window.innerWidth, 1200));
      canvasH = Math.max(640, Math.min(window.innerHeight, 1000));
      createCanvas(canvasW, canvasH);

      centerX = width / 2;
      centerY = height / 2;

      setupPosition();
      noLoop();
    }

    function windowResized() {
      canvasW = Math.max(720, Math.min(window.innerWidth, 1200));
      canvasH = Math.max(640, Math.min(window.innerHeight, 1000));
      resizeCanvas(canvasW, canvasH);
      centerX = width / 2;
      centerY = height / 2;
      redraw();
    }

    function drawHex(x, y, size, fillCol, strokeCol) {
      push();
      translate(x, y);
      stroke(strokeCol);
      strokeWeight(OUTLINE);
      fill(fillCol);
      beginShape();
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 180 * (60 * i - 30); // pointy-top
        vertex(size * Math.cos(angle), size * Math.sin(angle));
      }
      endShape(CLOSE);
      pop();
    }

    function drawPiece(x, y, p) {
      push();
      translate(x, y);
      noStroke();
      fill(p.side === 'W' ? '#eceff4' : '#3b4252');
      circle(0, 0, HEX_SIZE * 1.05);

      // side ring
      noFill();
      stroke(p.side === 'W' ? '#2e3440' : '#d8dee9');
      strokeWeight(3);
      circle(0, 0, HEX_SIZE * 0.7);

      if (p.type === 'Q') {
        // Queen marker: inner hex
        strokeWeight(2.5);
        const r = HEX_SIZE * 0.35;
        beginShape();
        for (let i = 0; i < 6; i++) {
          const ang = Math.PI / 180 * (60 * i - 30);
          vertex(r * Math.cos(ang), r * Math.sin(ang));
        }
        endShape(CLOSE);
      } else if (p.type === 'D') {
        // Drone marker: center dot + size label
        noStroke();
        fill(p.side === 'W' ? '#2e3440' : '#d8dee9');
        circle(0, 0, HEX_SIZE * 0.28);

        // size text
        const sz = String(p.size || 1);
        textAlign(CENTER, CENTER);
        textSize(HEX_SIZE * 0.36);
        fill(p.side === 'W' ? '#2e3440' : '#d8dee9'); // same as dot for cohesion
        // small contrast stroke for legibility
        stroke(p.side === 'W' ? '#eceff4' : '#3b4252');
        strokeWeight(2);
        text(sz, 0, 0.5);
      }
      pop();
    }

    function boardCells() {
      const cells = [];
      for (let r = -RADIUS; r <= RADIUS; r++) {
        for (let q = -RADIUS; q <= RADIUS; q++) {
          if (!inBounds(q, r)) continue;
          const {x, y} = axialToPixel(q, r);
          cells.push({q, r, x: centerX + x, y: centerY + y});
        }
      }
      return cells;
    }

    function mouseToAxial() {
      const localX = mouseX - centerX;
      const localY = mouseY - centerY;
      const {q, r} = pixelToAxial(localX, localY);
      return inBounds(q, r) ? {q, r} : null;
    }

    function draw() {
      background('#0f1115');

      const cells = boardCells();

      // board
      for (const c of cells) {
        // base 3-coloring
        let fillCol = TRI_COLORS[triColorIndex(c.q, c.r)];

        // selection tint (overlay style so base color still matters)
        const isSel = State.selected && State.selected.q === c.q && State.selected.r === c.r;
        if (isSel) fillCol = '#293141';

        drawHex(c.x, c.y, HEX_SIZE, fillCol, '#2d3442');
        const isCenterHex = (c.q === 0 && c.r === 0);
        if (isCenterHex) {
          // overlay ring
          push();
          translate(c.x, c.y);
          noFill();
          stroke('#242b39'); // or any accent
          strokeWeight(3);
          polygon(HEX_SIZE * 0.88);
          pop();
        }
      }

      // Placement targets highlight
      if (State.phase !== 'play') {
        const targets = legalPlacementHexes();
        for (const t of targets) {
          const {x, y} = axialToPixel(t.q, t.r);
          push();
          translate(centerX + x, centerY + y);
          noFill();
          stroke('#a3be8c');   // green ring for placement
          strokeWeight(3);
          polygon(HEX_SIZE * 0.82);
          pop();
        }
      }

      if (State.phase !== 'play') {
        const targets = legalPlacementHexes();
        for (const t of targets) {
          const {x, y} = axialToPixel(t.q, t.r);
          push();
          translate(centerX + x, centerY + y);
          noFill();
          // green for empty placements, gold for stackable
          stroke(t.kind === 'stack' ? '#ebcb8b' : '#a3be8c');
          strokeWeight(3);
          polygon(HEX_SIZE * 0.82);
          pop();
        }
      }

      // legal move highlights
      for (const mv of State.legalMoves) {
        const {x, y} = axialToPixel(mv.to.q, mv.to.r);
        push();
        translate(centerX + x, centerY + y);
        stroke('#88c0d0');
        strokeWeight(3);
        noFill();
        polygon(HEX_SIZE * 0.82);
        pop();
      }

      // pieces
      for (const c of cells) {
        const p = getPiece(c.q, c.r);
        if (p) drawPiece(c.x, c.y, p);
      }

      // hover ring
      const a = mouseToAxial();
      if (a) {
        const {x, y} = axialToPixel(a.q, a.r);
        push();
        translate(centerX + x, centerY + y);
        noFill();
        stroke('#5e81ac');
        strokeWeight(2);
        polygon(HEX_SIZE * 0.9);
        pop();
      }
    }

    function polygon(radius) {
      beginShape();
      for (let i = 0; i < 6; i++) {
        const ang = Math.PI / 180 * (60 * i - 30);
        vertex(radius * Math.cos(ang), radius * Math.sin(ang));
      }
      endShape(CLOSE);
    }

    /* === Input === */
    function mousePressed() {
      if (State.winner) return;
      const a = mouseToAxial();
      if (!a) return;

      // === PLACEMENT PHASE ===
      if (State.phase !== 'play') {
        if (!isPerimeter(a.q, a.r)) return;            // perimeter only
        const occ = getPiece(a.q, a.r);

        if (State.phase === 'place_queen') {
          // Queen must go on EMPTY perimeter
          if (occ) return;
          const P = State.placements[State.turn];
          if (P.queenPlaced) return;                   // safety
          setPiece(a.q, a.r, {side: State.turn, type: 'Q', size: 1});
          P.queenPlaced = true;
          State.selected = null;
          State.legalMoves = [];
          advancePlacementTurn();                      // may switch side / phase
          redraw();
          return;                                      // <<< DO NOT FALL THROUGH
        }

        if (State.phase === 'place_drones') {
          const P = State.placements[State.turn];
          if (P.dronesPlaced >= DRONES_PER_SIDE) return;

          if (!occ) {
            setPiece(a.q, a.r, {side: State.turn, type: 'D', size: 1});
          } else if (occ.side === State.turn && occ.type === 'D') {
            // stack up to max
            const next = Math.min(MAX_STACK, (occ.size || 1) + 1);
            if (next === (occ.size || 1)) return;      // at cap
            setPiece(a.q, a.r, {...occ, size: next});
          } else {
            return;                                    // can't place on enemy or queen
          }

          P.dronesPlaced += 1;
          State.selected = null;
          State.legalMoves = [];
          advancePlacementTurn();
          redraw();
          return;                                      // <<< DO NOT FALL THROUGH
        }

        return; // safety
      }

      // === PLAY PHASE ===
      const clickedPiece = getPiece(a.q, a.r);

      if (clickedPiece && clickedPiece.side === State.turn) {
        State.selected = {q: a.q, r: a.r};
        State.legalMoves = legalMovesFrom(a.q, a.r);
        redraw();
        return;
      }

      if (State.selected) {
        const mv = State.legalMoves.find(m => m.to.q === a.q && m.to.r === a.r);
        if (mv) {
          applyMove(State.selected, mv);
          State.selected = null;
          State.legalMoves = [];
          redraw();
          return;
        }
      }
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      setupPosition();
      redraw();
      document.getElementById('resetWrap').style.display = 'none';
    });
  </script>
</body>

</html>
