<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hex Slide-Capture (p5.js)</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #0f1115;
      color: #e5e9f0;
      font-family: system-ui, sans-serif;
    }

    #ui {
      position: fixed;
      inset: 12px auto auto 12px;
      background: #181a20;
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #2a2f3a;
      color: #e5e9f0;
      font-weight: 600;
    }

    a {
      color: #88c0d0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    canvas {
      display: block;
      margin: 0 auto;
    }

    .pc-btn {
      border: none;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .25);
    }

    .pc-white {
      background: #eceff4;
      color: #2e3440;
    }

    .pc-black {
      background: #3b4252;
      color: #eceff4;
    }

    .pc-btn.active {
      outline: 3px solid #a3be8c;
    }

    .pc-btn.disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .pc-label {
      font-size: 13px;
      opacity: .8;
    }

    .pc-rem {
      font-weight: 600;
      opacity: .85;
    }
  </style>
</head>

<body>
  <div id="ui">
    <div><strong>Hexation (v0.2)</strong></div>
    <div style="margin-top:6px">Turn: <span id="turn" class="badge">White</span></div>
    <div id="resetWrap" style="margin-top:8px; display:none;">
      <button id="resetBtn" style="background:#2e3440;color:#eceff4;border:none;padding:6px 12px;
           border-radius:6px;cursor:pointer;font-weight:600;">
        Reset Game
      </button>
    </div>
    <div style="margin-top:6px;font-size:13px;opacity:.85">
      <p>Click a piece ➜ click a highlighted hex. Slide any distance; land on enemy to capture.</p>
    </div>
    <div id="placeControls" style="margin-top:8px; display:flex; gap:8px; align-items:center;">
      <div class="pc-label">Place Drone:</div>
      <button id="placeW" class="pc-btn pc-white" title="White place/stack toggle">W <span id="remW"
          class="pc-rem">(0)</span></button>
      <button id="placeB" class="pc-btn pc-black" title="Black place/stack toggle">B <span id="remB"
          class="pc-rem">(0)</span></button>
    </div>
  </div>

  <!-- p5.js v2 (pin to current 2.0.5) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.0.5/lib/p5.min.js"></script>
  <script>
    /* === Geometry & coordinates (axial) === */
    const RADIUS = 5;                  // board radius (hexagon with 2*R+1 rows at widest)
    const HEX_SIZE = 36;               // pixel radius of hex
    const OUTLINE = 1.5;
    const DRONES_PER_SIDE = 6; // tweak to your liking
    const MAX_STACK = 5;

    // Placement intent now comes ONLY from the UI toggles (no keyboard)
    function isPlaceIntent() {return !!State.placeMode;}
    function isCenter(q, r) {
      return q === 0 && r === 0;
    }
    function isPerimeter(q, r) {
      // A hex is on the perimeter if any of |q|, |r|, |q+r| equals RADIUS
      return Math.abs(q) === RADIUS || Math.abs(r) === RADIUS || Math.abs(q + r) === RADIUS;
    }

    const dirs = [                     // axial neighbor directions (pointy-top)
      {q: +1, r: 0}, {q: +1, r: -1}, {q: 0, r: -1},
      {q: -1, r: 0}, {q: -1, r: +1}, {q: 0, r: +1}
    ];

    function axialToPixel(q, r) {
      const x = HEX_SIZE * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
      const y = HEX_SIZE * (3 / 2 * r);
      return {x, y};
    }

    function pixelToAxial(x, y) {
      // inverse of axialToPixel using "pointy" orientation
      const qf = (Math.sqrt(3) / 3 * x - 1 / 3 * y) / HEX_SIZE;
      const rf = (2 / 3 * y) / HEX_SIZE;
      return cubeRound(axialToCube(qf, rf));
    }

    function axialToCube(q, r) {return {x: q, y: -q - r, z: r};}
    function cubeToAxial(x, y, z) {return {q: x, r: z};}
    function cubeRound(c) {
      let rx = Math.round(c.x), ry = Math.round(c.y), rz = Math.round(c.z);
      const x_diff = Math.abs(rx - c.x);
      const y_diff = Math.abs(ry - c.y);
      const z_diff = Math.abs(rz - c.z);
      if (x_diff > y_diff && x_diff > z_diff) rx = -ry - rz;
      else if (y_diff > z_diff) ry = -rx - rz;
      else rz = -rx - ry;
      return cubeToAxial(rx, ry, rz);
    }

    // 3-color palette for base tiles
    const TRI_COLORS = ['#1b1f27', '#202633', '#242b39']; // tweak freely

    function triColorIndex(q, r) {
      return ((q - r) % 3 + 3) % 3; // 0,1,2 repeating
    }

    function inBounds(q, r) {
      return Math.abs(q) <= RADIUS && Math.abs(r) <= RADIUS && Math.abs(q + r) <= RADIUS;
    }

    /* === Game state === */
    const State = {
      pieces: new Map(),                 // "q,r" -> { side:'W'|'B', type:'Q'|'D', size:number }
      selected: null,
      legalMoves: [],
      turn: 'W',
      centerClaimOwner: null,  // 'W' | 'B' | null
      winner: null,
      placeMode: false,
      placements: {
        W: {queenPlaced: false, dronesPlaced: 0},
        B: {queenPlaced: false, dronesPlaced: 0},
      }
    };

    // toggle state (shared, but we’ll guard by whose turn it is)
    State.placeMode = false;

    function remainingDrones(side) {
      const P = State.placements[side];
      return Math.max(0, DRONES_PER_SIDE - (P?.dronesPlaced || 0));
    }

    function isPlaceIntent() {
      // Shift held OR manual toggle
      return (typeof keyIsDown === 'function' && keyIsDown(16)) || State.placeMode; // 16 = SHIFT
    }

    function coordKey(q, r) {return `${q},${r}`;}
    function getPiece(q, r) {return State.pieces.get(coordKey(q, r)) || null;}
    function setPiece(q, r, p) {if (p) State.pieces.set(coordKey(q, r), p); else State.pieces.delete(coordKey(q, r));}

    /* === Initial setup === */
    function setupPosition() {
      State.pieces.clear();
      State.turn = 'W';
      State.selected = null;
      State.legalMoves = [];
      State.winner = null;
      State.centerClaimOwner = null;
      State.placements = {
        W: {queenPlaced: false, dronesPlaced: 0},
        B: {queenPlaced: false, dronesPlaced: 0},
      };
      updateTurnUI();
    }

    function legalMovesFrom(q, r) {
      const piece = getPiece(q, r);
      if (!piece || piece.side !== State.turn) return [];
      const moves = [];

      if (piece.type === 'Q') {
        // Queen: one step any direction
        for (const d of dirs) {
          const q2 = q + d.q, r2 = r + d.r;
          if (!inBounds(q2, r2)) continue;
          const occ = getPiece(q2, r2);
          if (!occ || occ.side !== piece.side) moves.push({to: {q: q2, r: r2}});
        }
      } else if (piece.type === 'D') {
        // Drone: can move 1..size steps, straight, no passing through pieces
        const maxSteps = Math.max(1, piece.size || 1);
        for (const d of dirs) {
          for (let step = 1; step <= maxSteps; step++) {
            const q2 = q + d.q * step, r2 = r + d.r * step;
            if (!inBounds(q2, r2)) break;
            const occ = getPiece(q2, r2);
            if (!occ) moves.push({to: {q: q2, r: r2}});
            else {if (occ.side !== piece.side) moves.push({to: {q: q2, r: r2}}); break;}
          }
        }
      }

      return moves;
    }

    function legalPlacementHexes() {
      const spots = [];
      const side = State.turn;
      const P = State.placements[side];

      // Queen-first still shows empty perimeter
      if (!P.queenPlaced) {
        for (let r = -RADIUS; r <= RADIUS; r++) for (let q = -RADIUS; q <= RADIUS; q++) {
          if (!inBounds(q, r) || !isPerimeter(q, r)) continue;
          if (!getPiece(q, r)) spots.push({q, r, kind: 'queen'});
        }
        return spots;
      }

      // Only show drone spots if toggle ON
      if (!State.placeMode || remainingDrones(side) === 0) return spots;

      for (let r = -RADIUS; r <= RADIUS; r++) for (let q = -RADIUS; q <= RADIUS; q++) {
        if (!inBounds(q, r) || !isPerimeter(q, r)) continue;
        const occ = getPiece(q, r);
        if (!occ) spots.push({q, r, kind: 'drone-empty'});
        else if (occ.side === side && occ.type === 'D' && (occ.size || 1) < MAX_STACK)
          spots.push({q, r, kind: 'drone-stack'});
      }
      return spots;
    }

    /* === Apply moves === */
    function applyMove(from, move) {
      const src = getPiece(from.q, from.r);
      if (!src) return;

      const moverSide = src.side;
      const captured = getPiece(move.to.q, move.to.r); // may be null

      // move (capture by replacement if occupied)
      setPiece(move.to.q, move.to.r, src);
      setPiece(from.q, from.r, null);

      // queen-capture sudden death (unchanged)
      if (captured && captured.type === 'Q') {
        State.winner = moverSide;
        updateTurnUI();
        return;
      }

      // --- Center-cell effects (no instant wins here) ---
      const landed = getPiece(move.to.q, move.to.r); // the piece now on destination

      // Drone upgrade on center
      if (landed && landed.type === 'D' && isCenter(move.to.q, move.to.r)) {
        const newSize = typeof landed.size === 'number' ? Math.max(landed.size, MAX_STACK) : MAX_STACK;
        setPiece(move.to.q, move.to.r, {...landed, size: newSize});
      }

      // Claim / hold logic for the center:
      // - If a queen occupies center at end of the turn, she "claims" it for her side.
      // - If the *other* side just finished their turn and the claim still stands, the claimer wins.
      const center = getPiece(0, 0);
      if (center && center.type === 'Q') {
        const queenSide = center.side;

        if (State.centerClaimOwner === queenSide) {
          // The same side still owns the claim.
          // If the *mover* was the opponent, that means the queen survived their whole turn -> win now.
          if (moverSide !== queenSide) {
            State.winner = queenSide;
            updateTurnUI();
            return;
          }
          // If moverSide == queenSide, they either just claimed or kept it on their own move—no win yet.
        } else {
          // New (or switched) claim
          State.centerClaimOwner = queenSide;
        }
      } else {
        // No queen on center -> clear any claim
        State.centerClaimOwner = null;
      }

      // (optional) fallback elimination rule; remove if not desired
      const hasW = [...State.pieces.values()].some(p => p.side === 'W');
      const hasB = [...State.pieces.values()].some(p => p.side === 'B');
      if (!hasW) {State.winner = 'B'; updateTurnUI(); return;}
      if (!hasB) {State.winner = 'W'; updateTurnUI(); return;}

      // Normal turn switch
      switchTurn();
    }

    /* === Turn handling === */
    function switchTurn() {
      State.turn = (State.turn === 'W') ? 'B' : 'W';
      State.placeMode = false;  // reset toggle each turn
      updateTurnUI();
    }

    function updateTurnUI() {
      const el = document.getElementById('turn');
      if (State.winner) {
        el.textContent = (State.winner === 'W' ? 'White wins' : 'Black wins');
        const wrap = document.getElementById('resetWrap');
        if (wrap) wrap.style.display = 'block';
      } else {
        const P = State.placements[State.turn];
        if (!P.queenPlaced) el.textContent = (State.turn === 'W' ? 'White' : 'Black') + ' — place QUEEN';
        else if (remainingDrones(State.turn) > 0)
          el.textContent = (State.turn === 'W' ? 'White' : 'Black') + ' — move OR place DRONE';
        else
          el.textContent = (State.turn === 'W' ? 'White' : 'Black');
        const wrap = document.getElementById('resetWrap');
        if (wrap) wrap.style.display = 'none';
      }

      // counts
      document.getElementById('remW').textContent = `(${remainingDrones('W')})`;
      document.getElementById('remB').textContent = `(${remainingDrones('B')})`;

      // enable/disable + active highlight
      const enableW = State.turn === 'W' && State.placements.W.queenPlaced && remainingDrones('W') > 0 && !State.winner;
      const enableB = State.turn === 'B' && State.placements.B.queenPlaced && remainingDrones('B') > 0 && !State.winner;

      placeBtnW.classList.toggle('disabled', !enableW);
      placeBtnB.classList.toggle('disabled', !enableB);

      // show which side is toggled (only meaningful on that side’s turn)
      placeBtnW.classList.toggle('active', enableW && State.placeMode && State.turn === 'W');
      placeBtnB.classList.toggle('active', enableB && State.placeMode && State.turn === 'B');
    }

    /* === p5 sketch === */
    let canvasW, canvasH, centerX, centerY;

    function setup() {
      canvasW = Math.max(720, Math.min(window.innerWidth, 1200));
      canvasH = Math.max(640, Math.min(window.innerHeight, 1000));
      createCanvas(canvasW, canvasH);

      centerX = width / 2;
      centerY = height / 2;

      setupPosition();
      noLoop();
    }

    function windowResized() {
      canvasW = Math.max(720, Math.min(window.innerWidth, 1200));
      canvasH = Math.max(640, Math.min(window.innerHeight, 1000));
      resizeCanvas(canvasW, canvasH);
      centerX = width / 2;
      centerY = height / 2;
      redraw();
    }

    function drawHex(x, y, size, fillCol, strokeCol) {
      push();
      translate(x, y);
      stroke(strokeCol);
      strokeWeight(OUTLINE);
      fill(fillCol);
      beginShape();
      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 180 * (60 * i - 30); // pointy-top
        vertex(size * Math.cos(angle), size * Math.sin(angle));
      }
      endShape(CLOSE);
      pop();
    }

    function drawPiece(x, y, p) {
      push();
      translate(x, y);
      noStroke();
      fill(p.side === 'W' ? '#eceff4' : '#3b4252');
      circle(0, 0, HEX_SIZE * 1.05);

      // side ring
      noFill();
      stroke(p.side === 'W' ? '#2e3440' : '#d8dee9');
      strokeWeight(3);
      circle(0, 0, HEX_SIZE * 0.7);

      if (p.type === 'Q') {
        // Queen marker: inner hex
        strokeWeight(2.5);
        const r = HEX_SIZE * 0.35;
        beginShape();
        for (let i = 0; i < 6; i++) {
          const ang = Math.PI / 180 * (60 * i - 30);
          vertex(r * Math.cos(ang), r * Math.sin(ang));
        }
        endShape(CLOSE);
      } else if (p.type === 'D') {
        // Drone marker: center dot + size label
        noStroke();
        fill(p.side === 'W' ? '#2e3440' : '#d8dee9');
        circle(0, 0, HEX_SIZE * 0.28);

        // size text
        const sz = String(p.size || 1);
        textAlign(CENTER, CENTER);
        textSize(HEX_SIZE * 0.36);
        fill(p.side === 'W' ? '#2e3440' : '#d8dee9'); // same as dot for cohesion
        // small contrast stroke for legibility
        stroke(p.side === 'W' ? '#eceff4' : '#3b4252');
        strokeWeight(2);
        text(sz, 0, 0.5);
      }
      pop();
    }

    function boardCells() {
      const cells = [];
      for (let r = -RADIUS; r <= RADIUS; r++) {
        for (let q = -RADIUS; q <= RADIUS; q++) {
          if (!inBounds(q, r)) continue;
          const {x, y} = axialToPixel(q, r);
          cells.push({q, r, x: centerX + x, y: centerY + y});
        }
      }
      return cells;
    }

    function mouseToAxial() {
      const localX = mouseX - centerX;
      const localY = mouseY - centerY;
      const {q, r} = pixelToAxial(localX, localY);
      return inBounds(q, r) ? {q, r} : null;
    }

    function draw() {
      background('#0f1115');

      const cells = boardCells();

      // board
      for (const c of cells) {
        // base 3-coloring
        let fillCol = TRI_COLORS[triColorIndex(c.q, c.r)];

        // selection tint (overlay style so base color still matters)
        const isSel = State.selected && State.selected.q === c.q && State.selected.r === c.r;
        if (isSel) fillCol = '#293141';

        drawHex(c.x, c.y, HEX_SIZE, fillCol, '#2d3442');
        const isCenterHex = (c.q === 0 && c.r === 0);
        if (isCenterHex) {
          // overlay ring
          push();
          translate(c.x, c.y);
          noFill();
          stroke('#242b39'); // or any accent
          strokeWeight(3);
          polygon(HEX_SIZE * 0.88);
          pop();
        }
      }

      const targets = legalPlacementHexes();
      for (const t of targets) {
        const {x, y} = axialToPixel(t.q, t.r);
        push(); translate(centerX + x, centerY + y); noFill();
        stroke(t.kind === 'queen' ? '#a3be8c' : t.kind === 'drone-stack' ? '#ebcb8b' : '#88c0d0');
        strokeWeight(3); polygon(HEX_SIZE * 0.82); pop();
      }

      // legal move highlights
      for (const mv of State.legalMoves) {
        const {x, y} = axialToPixel(mv.to.q, mv.to.r);
        push();
        translate(centerX + x, centerY + y);
        stroke('#88c0d0');
        strokeWeight(3);
        noFill();
        polygon(HEX_SIZE * 0.82);
        pop();
      }

      // pieces
      for (const c of cells) {
        const p = getPiece(c.q, c.r);
        if (p) drawPiece(c.x, c.y, p);
      }

      // hover ring
      const a = mouseToAxial();
      if (a) {
        const {x, y} = axialToPixel(a.q, a.r);
        push();
        translate(centerX + x, centerY + y);
        noFill();
        stroke('#5e81ac');
        strokeWeight(2);
        polygon(HEX_SIZE * 0.9);
        pop();
      }
    }

    function polygon(radius) {
      beginShape();
      for (let i = 0; i < 6; i++) {
        const ang = Math.PI / 180 * (60 * i - 30);
        vertex(radius * Math.cos(ang), radius * Math.sin(ang));
      }
      endShape(CLOSE);
    }

    /* === Input === */
    function mousePressed() {
      if (State.winner) return;
      const a = mouseToAxial();
      if (!a) return;

      const P = State.placements[State.turn];
      const occ = getPiece(a.q, a.r);

      // 1) If your queen isn't placed yet: MUST place it on empty perimeter.
      if (!P.queenPlaced) {
        if (!isPerimeter(a.q, a.r) || occ) return;
        setPiece(a.q, a.r, {side: State.turn, type: 'Q', size: 1});
        P.queenPlaced = true;
        State.selected = null;
        State.legalMoves = [];
        switchTurn();
        redraw();
        return;
      }

      // 2) If place intent is ON, try to place/stack a drone first (even if clicked on your drone)
      if (isPlaceIntent() && remainingDrones(State.turn) > 0 && isPerimeter(a.q, a.r)) {
        const occ = getPiece(a.q, a.r);
        if (!occ) {
          setPiece(a.q, a.r, {side: State.turn, type: 'D', size: 1});
          State.placements[State.turn].dronesPlaced += 1;
          // keep placeMode ON so you can place multiple in a row if you want
          switchTurn();
          redraw();
          return;
        } else if (occ.side === State.turn && occ.type === 'D') {
          const next = Math.min(MAX_STACK, (occ.size || 1) + 1);
          if (next > (occ.size || 1)) {
            setPiece(a.q, a.r, {...occ, size: next});
            State.placements[State.turn].dronesPlaced += 1;
            switchTurn();
            redraw();
            return;
          }
        }
        // fall through if illegal (enemy/queen or at cap)
      }

      // 3) If a piece is selected, try to MOVE (selection has priority when not placing)
      if (State.selected) {
        const mv = State.legalMoves.find(m => m.to.q === a.q && m.to.r === a.r);
        if (mv) {
          applyMove(State.selected, mv);
          State.selected = null;
          State.legalMoves = [];
          redraw();
          return;
        }
        // switch selection if clicking another of your pieces
        if (occ && occ.side === State.turn) {
          State.selected = {q: a.q, r: a.r};
          State.legalMoves = legalMovesFrom(a.q, a.r);
          redraw();
          return;
        }
        // otherwise clear selection
        State.selected = null;
        State.legalMoves = [];
        redraw();
        return;
      }

      // 4) No selection active and not placing: clicking your own piece selects it (to move)
      if (occ && occ.side === State.turn) {
        State.selected = {q: a.q, r: a.r};
        State.legalMoves = legalMovesFrom(a.q, a.r);
        redraw();
        return;
      }

      // 5) Otherwise do nothing
    }

    const placeBtnW = document.getElementById('placeW');
    const placeBtnB = document.getElementById('placeB');

    placeBtnW.addEventListener('click', () => {
      // Only White can toggle on White's turn, after placing queen, with drones left
      const P = State.placements.W;
      if (State.turn !== 'W' || !P.queenPlaced || remainingDrones('W') === 0) return;
      State.placeMode = !State.placeMode;
      updateTurnUI();
      redraw();
    });

    placeBtnB.addEventListener('click', () => {
      const P = State.placements.B;
      if (State.turn !== 'B' || !P.queenPlaced || remainingDrones('B') === 0) return;
      State.placeMode = !State.placeMode;
      updateTurnUI();
      redraw();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      setupPosition();
      redraw();
      document.getElementById('resetWrap').style.display = 'none';
    });
  </script>
</body>

</html>
